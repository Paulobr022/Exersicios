<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="" method="post">
        <fieldset>
            <legend>
                <p>Cadastro</p>
            </legend>
                <label for="iman">Homem</label>
                <input type="radio" name="sexo" id="iman">

                <label for="iwom">Mulher</label>
                <input type="radio" name="sexo" id="iwom">
        </fieldset>

        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required minlength="6" maxlength="40">
        </p>    

        <p>
            <label for="idata">Data de Nacimento:</label>
            <input type="date" name="data" id="idata" required min="1900" max="2027" >
        </p>
        <p>
            <label for="imei">E-mail:</label>
            <input type="email" name="mei" id="imei" required>
        
        </p>
        <p>
            <label for="itel">Telefone:</label>
            <input type="tel" name="tel" id="itel" required maxlength="11" >
        
        </p>
        <p>
            <label for="icor">Cor Favorita</label>
            <input type="color" name="cor" id="icor" required>
        
        </p>
        <p>
            <label for="ifoto">Foto</label>
            <input type="" src="foto" alt="ifoto">
        </p>
        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>
    </form>
</body>
</html>
