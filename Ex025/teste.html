<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;

        }

        h1 {
            text-align: center;
        }
    </style>
</head>
<body>

    <form action="cadastro.php" method="post" autocomplete="on">

        <h1>teste de formulario</h1>
    <fieldset>
        <legend>
            Formulario de Incrição
        </legend>
    </fieldset>
    <fieldset>
        <label for="ifemn">Feminino</label>
        <input type="radio" name="sexo" id="ifemn" required>

        <label for="imasc">Masculino</label>
        <input type="radio" name="sexo" id="imasc" required>

    </fieldset>

        <p>
        <label for="inome">Nome:</label>
        <input type="text" name="nome" id="inome" required 
        autocomplete="username" placeholder="Nome do Usuario" minlength="6" maxlength="30">
    </p>


    <p>
        <label for="isenha">Senha</label>
        <input type="password" name="senha" id="isenha" required placeholder="Sua senha" minlength="8" maxlength="12">
    </p>

    <p>
        <label for="idata">Data:</label>
        <input type="date" name="date" id="idate" required placeholder="Data de Nacimento" >
    </p>

    <p>
        <label for="imes">Mes:</label>
        <input type="month" name="mes" id="imes" required onloadeddata="AnimationTimeline">
    </p>

    <p>
        <label for="icor">Cor Favorita:</label>
        <input type="color" name="cor" id="icor" required>
    </p>

    <p>
        <input type="reset" value="Resetar">
        <input type="submit" value="Enviar">
    </p>
    </form>

    
</body>
</html>
