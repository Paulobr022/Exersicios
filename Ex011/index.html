<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="Imagens/Foto-G.png" alt="Imagem flexivel">
    </picture>
    <h1>Reproduzindo audio</h1>
   <p>audio em <abbr title="Hyper text linguas">htmlt</abbr></p>
   <audio preload="metadata" controls loop>
    <source src="midia/gemidatroll.mp3" type="audio/mpeg">
    <source src="midia/gemidatroll.mp3" type="audio/ogg">
    <source src="midia/gemidatroll.mp3" type="audio/wav">
    <p>Infelismente seu navegador nao conegue carregar audio, baixe clicanfo <a href="midia/gemidatroll.mp3">aqui</a> hr</p>
   </audio>

</body>
</html>
