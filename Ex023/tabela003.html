<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif
        }

        table {
            border-collapse: collapse;
            width: 300px;
        }
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
            background-color: lightcoral;
        }

        .col1 {
            background-color: lightgreen;
        }
        .row1{
            background: lightblue;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de celulas</h1>

    <table>
        <tr>
            
            <td colspan="3" class="col1">B</td>
            
        </tr>
        <tr>
            <td rowspan="3" class="row1">D</td>
            <td>E</td>
            <td rowspan="3" class="row1">F</td>
        </tr>
        <tr>
            
            <td>H</td>
            
        </tr>
        <tr>
            
            <td>K</td>
            
        </tr>
        <tr>
            <td colspan="3" class="col1">M</td>
        </tr>
    </table>
</body>
</html>
