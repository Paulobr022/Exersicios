<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center; /* Alinhamento horizontal*/
            font-weight: bolder;
            vertical-align: middle;/* Alinhamento vertical
                                                top
                                                middle
                                                bottom*/

                                                

        }

        .numero {
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!-- Hierarquia de tabelas (Simples)
        TABLE = tabela 
        TABLE ROW = Linha de tabela
        TABLE HEADER = Cabeçalho de tabela
        TABLE DATA = Dado de tabela
    -->

    <table>
        <tr><!--Primeira linha-->
            <th>1</th>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr><!--segunda linha-->
            <th>2</th>
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>
        </tr>
        <tr><!--terceira linha-->
            <th>3</th>
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>
        <tr><!--quarta linha-->
            <th>4</th>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
        <tr>
            <th>5</th>
            <td>A5</td>
            <td>B5</td>
            <td>C5</td>
        </tr>
        
    </table>
</body>
</html>
