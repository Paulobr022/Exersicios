<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
    /*SELETORES PERSONALIZADOS
        # = id 
        . = class 
        : = pseudo-class
        :: = pseudo-element
        > = children*/
        
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;

        }

        a:hover {
            text-decoration: underline;
            color: black;

        }

        a:active {
            color: yellow;
        }
        .especial {
            background-color: lightgreen;
        }
        .especial::before {
            content: ' » ';
            text-decoration: none;
            font-weight: bold;
            color:darkgray;
        }

        .especial::after {
            content: ' « ';
            text-decoration: none;
            font-weight: bold;
            color:darkgray;
        }
    </style>
</head>
