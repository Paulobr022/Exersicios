<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {/* box level*/

            display: block;
            background-color: lightgreen;
            height: 300px;
            width: 300px;


            border: 10px solid darkblue;

            padding: 10px;

            margin: 20px auto 40px auto;
            
            outline:5px dashed salmon;
            
        }
        a {/* inline level*/
            display: block;
             background-color: lightblue;

             margin:auto;
             
            border-width: 10px;
            border-style: solid;
             border-color: sienna;

             padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Exemplo d ecaixas box-levels</h1>
    <p>Praragrafos tambem soa exemplos de box-level, mas os <a href="#">links sao exemplos de ciaxas inline levels </a>vamos ver como tudo isso funciona.</p>
</body>
</html>
